support: https://github.com/CBFerrum/ferrum-app-hr/issues
runtime: native
platform: ">=0.3.2, <0.4"
requires: {hr: ">=0.2", erp: ">=0.1"}
packages: [hr_erp, payroll_erp]
uninstall: ask
