package: hr
version: 0.3.0
label: Human Resources
description: Employees and organization, holiday lists, shifts and attendance from check-ins, leave with an approval workflow and a leave ledger, recruitment, appraisals and the employee lifecycle.
depends: [core]
field_prefix: hr_

overlays:
  - entity: Company
    ops:
      - {op: add_field, field: {name: hr_default_holiday_list, type: link, to: HolidayList, label: Default Holiday List}}
      - {op: add_field, field: {name: hr_notice_period_days, type: int, min: "0", label: Notice Period (Days), description: "Notice due from employees whose record sets none"}}

modules:
  - name: hr
    label: HR
    icon: users
    order: 70
    # The full and final statement comes with the connector to ERP (hr_erp); without it the item drops out.
    items: [Employee, EmployeeDocument, EmployeeDocumentType, Department, Designation, Branch, EmployeeGrade, EmploymentType, EmployeeOnboarding, EmployeeSeparation, FullAndFinalStatement,
            EmployeePromotion, EmployeeTransfer, report:employee_directory, report:headcount, report:employee_events, report:expiring_documents]
  - name: attendance
    label: Attendance & Leave
    icon: calendar
    order: 71
    items: [Attendance, AttendanceRequest, EmployeeCheckin, ShiftType, ShiftAssignment, HolidayList, LeaveApplication, LeaveAllocation, LeaveEncashment,
            LeaveType, LeavePolicy, LeaveLedgerEntry, report:monthly_attendance_sheet, report:leave_balance]
  - name: recruitment
    label: Recruitment
    icon: user-plus
    order: 73
    items: [JobOpening, JobApplicant, Interview, JobOffer, report:recruitment_pipeline]
  - name: performance
    label: Performance
    icon: target
    order: 74
    items: [Appraisal, AppraisalCycle, AppraisalTemplate, TrainingProgram, TrainingEvent, TrainingRecord]

workflows:
  - name: Leave Approval
    entity: LeaveApplication
    initial_state: Open
    states:
      - {name: Open, docstatus: 0}
      - {name: Approved, docstatus: 1}
      - {name: Rejected, docstatus: 1}
      - {name: Cancelled, docstatus: 2}
    transitions:
      - {action: Approve, from: Open, to: Approved, roles: [Leave Approver, HR Manager]}
      - {action: Reject, from: Open, to: Rejected, roles: [Leave Approver, HR Manager]}
      - {action: Cancel, from: Approved, to: Cancelled, roles: [Leave Approver, HR Manager, HR User]}
      - {action: Cancel, from: Rejected, to: Cancelled, roles: [Leave Approver, HR Manager, HR User]}
  - name: Attendance Request Approval
    entity: AttendanceRequest
    initial_state: Open
    states:
      - {name: Open, docstatus: 0}
      - {name: Approved, docstatus: 1}
      - {name: Rejected, docstatus: 1}
      - {name: Cancelled, docstatus: 2}
    transitions:
      - {action: Approve, from: Open, to: Approved, roles: [Leave Approver, HR Manager]}
      - {action: Reject, from: Open, to: Rejected, roles: [Leave Approver, HR Manager]}
      - {action: Cancel, from: Approved, to: Cancelled, roles: [Leave Approver, HR Manager, HR User]}
      - {action: Cancel, from: Rejected, to: Cancelled, roles: [Leave Approver, HR Manager, HR User]}

# What a personal-data request exports and erases for a person (their email). An employee keeps
# their name and employment dates, which payroll and tax records need; their private contact,
# family and bank details go. Applicants lose everything that names them.
personal_data:
  - {entity: Employee, match: personal_email, phone: cell_number, name: employee_name, erase: [personal_email, cell_number, current_address, permanent_address, date_of_birth, emergency_contact_name, emergency_phone, emergency_relation, bank_name, bank_account_no, ifsc_code, iban]}
  - {entity: JobApplicant, match: email_id, phone: phone_number, name: applicant_name, erase: [applicant_name, email_id, phone_number]}
  - {entity: JobOffer, match: applicant_email, erase: [applicant_name, applicant_email]}
  - {entity: Attendance, match: employee_user, retain: "Employment records"}
  - {entity: AttendanceRequest, match: employee_user, retain: "Employment records"}
  - {entity: EmployeeCheckin, match: employee_user, retain: "Employment records"}
  - {entity: ShiftAssignment, match: employee_user, retain: "Employment records"}
  - {entity: LeaveAllocation, match: employee_user, retain: "Employment records"}
  - {entity: LeaveApplication, match: employee_user, retain: "Employment records"}
  - {entity: LeaveLedgerEntry, match: employee_user, retain: "Employment records"}
  - {entity: EmployeeSeparation, match: employee_user, retain: "Employment records"}
  - {entity: EmployeePromotion, match: employee_user, retain: "Employment records"}
  - {entity: EmployeeTransfer, match: employee_user, retain: "Employment records"}
  - {entity: Appraisal, match: employee_user, retain: "Employment records"}
  - {entity: EmployeeDocument, match: employee_user, retain: "Employment records"}
roles:
  - name: HR Manager
    description: Everything in HR, including bank and identity details.
    permissions:
      - {entity: TrainingProgram, read: true, write: true, create: true, delete: true, export: true}
      - {entity: TrainingEvent, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: TrainingRecord, read: true, export: true}
      - {entity: Employee, read: true, write: true, create: true, delete: true, export: true, import: true, read_groups: [bank, identity, personal], write_groups: [bank, identity, personal]}
      - {entity: EmployeeDocumentType, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EmployeeDocument, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Department, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Designation, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Branch, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EmployeeGrade, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EmploymentType, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EmployeeOnboarding, read: true, write: true, create: true, delete: true, export: true}
      - {entity: EmployeeSeparation, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: EmployeePromotion, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, read_groups: [pay], write_groups: [pay]}
      - {entity: EmployeeTransfer, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: HolidayList, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: ShiftType, read: true, write: true, create: true, delete: true, export: true}
      - {entity: ShiftAssignment, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, import: true}
      - {entity: EmployeeCheckin, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Attendance, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, import: true}
      - {entity: AttendanceRequest, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: LeaveType, read: true, write: true, create: true, delete: true, export: true}
      - {entity: LeavePolicy, read: true, write: true, create: true, delete: true, export: true}
      - {entity: LeaveAllocation, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, import: true}
      - {entity: LeaveApplication, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, import: true}
      - {entity: LeaveLedgerEntry, read: true, export: true}
      - {entity: JobOpening, read: true, write: true, create: true, delete: true, export: true}
      - {entity: JobApplicant, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Interview, read: true, write: true, create: true, delete: true, export: true}
      - {entity: JobOffer, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, read_groups: [pay], write_groups: [pay]}
      - {entity: AppraisalCycle, read: true, write: true, create: true, delete: true}
      - {entity: AppraisalTemplate, read: true, write: true, create: true, delete: true}
      - {entity: Appraisal, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, read_groups: [review], write_groups: [review]}
      - {entity: AppraisalGoal, read_groups: [review], write_groups: [review]}
      - {entity: Company, read: true}
      - {entity: Currency, read: true}
  - name: HR User
    description: Day-to-day HR work; no bank details and no approvals.
    permissions:
      - {entity: Employee, read: true, write: true, create: true, export: true, read_groups: [identity, personal], write_groups: [identity, personal]}
      - {entity: EmployeeDocumentType, read: true}
      # Documents of the categories whose employee details they see: general and identity, not bank.
      - {entity: EmployeeDocument, read: true, write: true, create: true, delete: true, where: {category: [General, Identity]}}
      - {entity: Department, read: true, write: true, create: true}
      - {entity: Designation, read: true, write: true, create: true}
      - {entity: Branch, read: true, write: true, create: true}
      - {entity: EmployeeGrade, read: true}
      - {entity: EmploymentType, read: true}
      - {entity: EmployeeOnboarding, read: true, write: true, create: true, delete: true}
      - {entity: EmployeeSeparation, read: true, write: true, create: true, delete: true}
      - {entity: EmployeePromotion, read: true, write: true, create: true, delete: true, read_groups: [pay], write_groups: [pay]}
      - {entity: EmployeeTransfer, read: true, write: true, create: true, delete: true}
      - {entity: HolidayList, read: true, write: true, create: true}
      - {entity: ShiftType, read: true}
      - {entity: ShiftAssignment, read: true, write: true, create: true, delete: true, submit: true, cancel: true}
      - {entity: EmployeeCheckin, read: true, write: true, create: true, delete: true, import: true}
      - {entity: Attendance, read: true, write: true, create: true, delete: true, submit: true, cancel: true, import: true}
      - {entity: AttendanceRequest, read: true, write: true, create: true, delete: true, cancel: true}
      - {entity: LeaveType, read: true}
      - {entity: LeavePolicy, read: true}
      - {entity: LeaveAllocation, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: LeaveApplication, read: true, write: true, create: true, delete: true, cancel: true}
      - {entity: LeaveLedgerEntry, read: true}
      - {entity: JobOpening, read: true, write: true, create: true}
      - {entity: JobApplicant, read: true, write: true, create: true, delete: true, import: true}
      - {entity: Interview, read: true, write: true, create: true, delete: true}
      - {entity: JobOffer, read: true, write: true, create: true, delete: true, submit: true, read_groups: [pay], write_groups: [pay]}
      - {entity: AppraisalCycle, read: true}
      - {entity: AppraisalTemplate, read: true}
      - {entity: Appraisal, read: true, write: true, create: true, submit: true, read_groups: [review], write_groups: [review]}
      - {entity: AppraisalGoal, read_groups: [review], write_groups: [review]}
      - {entity: Company, read: true}
  - name: Employee
    description: Self-service; sees and creates only their own records (the employee whose user is the signed-in user).
    permissions:
      - {entity: Employee, read: true, if_owner: true, read_groups: [bank, identity, personal]}
      - {entity: EmployeeDocumentType, read: true}
      # Their own documents of the types they may see (uploading only those the type lets them, checked on save),
      # and as a manager, the general documents of those reporting to them whose type shows them to managers.
      - {entity: EmployeeDocument, read: true, write: true, create: true, if_owner: true, where: {visible_to: [Employee, Employee and Manager]}}
      - {entity: EmployeeDocument, read: true, via: employee.reports_to.user, where: {visible_to: Employee and Manager, category: General}}
      - {entity: LeaveApplication, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: EmployeeCheckin, read: true, create: true, if_owner: true}
      - {entity: Attendance, read: true, if_owner: true}
      - {entity: AttendanceRequest, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: ShiftAssignment, read: true, if_owner: true}
      - {entity: LeaveAllocation, read: true, if_owner: true}
      - {entity: LeaveLedgerEntry, read: true, if_owner: true}
      - {entity: Appraisal, read: true, write: true, if_owner: true, read_groups: [review]}
      - {entity: AppraisalGoal, read_groups: [review]}
      - {entity: EmployeePromotion, read: true, if_owner: true, read_groups: [pay]}
      - {entity: EmployeeTransfer, read: true, if_owner: true}
      - {entity: EmployeeSeparation, read: true, if_owner: true}
      - {entity: TrainingRecord, read: true, if_owner: true}
      - {entity: TrainingProgram, read: true}
      - {entity: LeaveType, read: true}
      - {entity: HolidayList, read: true}
      - {entity: ShiftType, read: true}
      - {entity: Department, read: true}
      - {entity: Designation, read: true}
      - {entity: Branch, read: true}
      - {entity: AppraisalCycle, read: true}
      - {entity: JobOpening, read: true}
  - name: Leave Approver
    description: Approves or rejects the leave applications and attendance requests routed to them.
    permissions:
      - {entity: LeaveApplication, read: true, write: true, submit: true, cancel: true}
      - {entity: AttendanceRequest, read: true, write: true, submit: true, cancel: true}
      - {entity: LeaveAllocation, read: true}
      - {entity: LeaveLedgerEntry, read: true}
      - {entity: LeaveType, read: true}
      - {entity: HolidayList, read: true}
  - name: Attendance Device
    description: For the API keys of biometric or RFID devices; they can only post check-ins.
    permissions:
      - {entity: EmployeeCheckin, create: true}

seed:
  - entity: EmploymentType
    key: [employment_type_name]
    records:
      - {employment_type_name: Full-time}
      - {employment_type_name: Part-time}
      - {employment_type_name: Probation}
      - {employment_type_name: Contract}
      - {employment_type_name: Intern}
      - {employment_type_name: Apprentice}
  - entity: LeaveType
    key: [leave_type_name]
    records:
      - {leave_type_name: Casual Leave, max_leaves_allowed: 12, max_continuous_days_allowed: 3}
      - {leave_type_name: Sick Leave, max_leaves_allowed: 12}
      - {leave_type_name: Privilege Leave, max_leaves_allowed: 18, applicable_after: 90, is_carry_forward: true, maximum_carry_forwarded_leaves: 30, allow_encashment: true, encashment_threshold_days: 10}
      - {leave_type_name: Leave Without Pay, is_lwp: true}
# 0.9.0: a separation submitted before it made its employee Left at once, also while they served
# notice. Those whose last working day has not passed are at work again until it has; the upkeep
# makes them Left after it.
backfills:
  - {name: serving_notice, entity: Employee, needs: "t.status = 'Left' and t.relieving_date >= current_date and exists (select 1 from e_employee_separation s where s.tenant_id = t.tenant_id and s.employee = t.id and s.docstatus = 1 and s.relieving_date = t.relieving_date)",
     set: "status = 'Active'"}
handover:
  - {entity: Employee, field: leave_approver}
  - {entity: Employee, field: expense_approver}
  - {entity: LeaveApplication, field: leave_approver, where: {status: Open}}
  - {entity: AttendanceRequest, field: approver, where: {status: Open}}

# What the app sends; a workspace edits the wording under Settings.
messages:
  - key: hr.document_expiring
    label: Employee document about to expire
    entity: EmployeeDocument
    values: [document_type]
    languages:
      en:
        email:
          subject: "{{ values.document_type }} of {{ doc.employee_name }} expires on {{ doc.expiry_date }}"
          body: "<p>The {{ values.document_type }} of {{ doc.employee_name }}{% if doc.document_number %} (number {{ doc.document_number }}){% endif %} expires on {{ doc.expiry_date }}.</p><p>Please renew it and add the new one to the employee's documents.</p>"
        inapp:
          title: "{{ values.document_type }} of {{ doc.employee_name }} expires on {{ doc.expiry_date }}"
          text: "Renew it and add the new one to the employee's documents."
