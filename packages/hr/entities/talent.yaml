- name: JobOpening
  label: Job Opening
  kind: master
  module: recruitment
  title_field: job_title
  company_scoped: true
  numbering: {template: "HR-OPN-{YYYY}-{seq:4}"}
  fields:
    - {name: job_title, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: designation, type: link, to: Designation, required: true, in_list: true, in_filter: true}
    - {name: department, type: link, to: Department, in_filter: true}
    - {name: employment_type, type: link, to: EmploymentType}
    - {name: branch, type: link, to: Branch}
    - {name: status, type: select, options: [Open, Closed], default: Open, required: true, in_list: true, in_filter: true}
    - {name: vacancies, type: int, default: 1, min: 1, required: true, in_list: true}
    - {name: hired, type: int, read_only: true, no_copy: true, in_list: true, description: Employees created from accepted offers}
    - {name: publish, type: check, label: Publish on Careers Page, in_filter: true}
    - {name: posted_on, type: date, default_expr: today}
    - {name: closes_on, type: date, description: The opening closes automatically after this date}
    - {name: lower_range, type: currency, min: "0", label: Salary From}
    - {name: upper_range, type: currency, min: "0", label: Salary To}
    - {name: description, type: markdown}
    - {name: requisition, type: link, to: JobRequisition, read_only: true, no_copy: true, description: "The approved requisition that opened it"}
    - {name: application_link, type: url, description: "Where candidates apply for this job (a form of the Forms app, say), for a published list of openings to show"}
    - {name: criteria, type: table, of: JobCriterion, description: "What interviewers score candidates on, each with its weight"}
  rules:
    - {name: salary_range, check: "doc.upper_range == 0.0 || doc.upper_range >= doc.lower_range", message: "Salary To must not be below Salary From"}
  list: {columns: [number, job_title, designation, vacancies, hired, status], sort: created_at desc}

- name: JobCriterion
  label: Interview Criterion
  kind: child
  fields:
    - {name: criterion, type: data, required: true, in_list: true}
    - {name: weight, type: decimal, default: 1, min: "0", in_list: true}

- name: JobRequisition
  label: Job Requisition
  kind: document
  module: recruitment
  submittable: true
  company_scoped: true
  title_field: job_title
  numbering: {template: "HR-REQ-{YYYY}-{seq:4}"}
  description: "A request to hire. Submitted after its approval (the package's default: the hiring manager's manager when the request names a hiring manager who has one, else an HR Manager; a workspace switches it off or replaces it), it opens the job opening."
  fields:
    - {name: job_title, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: designation, type: link, to: Designation, required: true, in_list: true, in_filter: true}
    - {name: department, type: link, to: Department, in_filter: true}
    - {name: employment_type, type: link, to: EmploymentType}
    - {name: branch, type: link, to: Branch}
    - {name: vacancies, type: int, default: 1, min: 1, required: true, in_list: true}
    - {name: lower_range, type: currency, min: "0", label: Salary From, perm_group: pay}
    - {name: upper_range, type: currency, min: "0", label: Salary To, perm_group: pay}
    - {name: expected_by, type: date, label: Needed By}
    - {name: reason, type: text}
    - {name: requested_by, type: email, default_expr: "user.email", read_only: true}
    - {name: hiring_manager, type: link, to: Employee, description: "Who the new hire reports to; their manager approves the request when they have one with a sign-in, else an HR Manager does"}
    - {name: manager_approver, type: email, read_only: true, no_copy: true, label: Approving Manager, description: "The sign-in of the hiring manager's manager, worked out when the request is saved"}
    - {name: job_opening, type: link, to: JobOpening, read_only: true, no_copy: true, in_list: true}
  list: {columns: [number, job_title, designation, vacancies, job_opening], sort: created_at desc}

- name: RecruitmentSettings
  label: Recruitment Settings
  kind: settings
  module: recruitment
  description: "Who approves a job offer besides an HR Manager, by salary band. Both bands empty: an offer is approved by an HR Manager alone. A band applies to an offer whose CTC is above its limit, and asks the person it names (a sign-in email) as well."
  fields:
    - {name: offer_band_1_above, type: decimal, precision: 2, min: "0", label: Band 1 Applies Above (CTC), description: "Empty or 0: no band"}
    - {name: offer_band_1_approver, type: email, label: Band 1 Approver}
    - {name: offer_band_2_above, type: decimal, precision: 2, min: "0", label: Band 2 Applies Above (CTC), description: "Empty or 0: no band"}
    - {name: offer_band_2_approver, type: email, label: Band 2 Approver}
  form:
    - {label: Offer approval, fields: [offer_band_1_above, offer_band_1_approver, offer_band_2_above, offer_band_2_approver]}

- name: JobStage
  label: Recruitment Stage
  kind: master
  module: recruitment
  title_field: stage_name
  description: "A step of hiring, in order. A job's own stages, else those for no job. The category is what the app reads: an applicant moved to a Rejected stage is rejected, to a Hired stage accepted."
  fields:
    - {name: stage_name, type: data, required: true, in_list: true}
    - {name: job_opening, type: link, to: JobOpening, in_list: true, in_filter: true, description: "Empty: for every job without stages of its own"}
    - {name: sequence, type: int, default: 0, in_list: true}
    - {name: category, type: select, options: [Screening, Interview, Offer, Hired, Rejected], required: true, in_list: true, in_filter: true}
  unique: [[job_opening, stage_name]]
  list: {columns: [stage_name, job_opening, sequence, category], sort: sequence asc}

- name: ApplicantStageMove
  label: Stage History
  kind: child
  fields:
    - {name: stage, type: link, to: JobStage, in_list: true}
    - {name: category, type: data, in_list: true}
    - {name: entered_on, type: datetime, in_list: true}
    - {name: moved_by, type: email, in_list: true}

- name: JobApplicant
  label: Job Applicant
  kind: master
  internal: true
  reference: restricted
  module: recruitment
  title_field: applicant_name
  numbering: {template: "HR-APP-{YYYY}-{seq:5}"}
  search_fields: [applicant_name, email_id]
  fields:
    - {name: applicant_name, type: data, required: true, in_list: true}
    - {name: email_id, type: email, required: true, in_list: true}
    - {name: phone_number, type: phone}
    - {name: job_opening, type: link, to: JobOpening, in_list: true, in_filter: true}
    - {name: designation, type: link, to: Designation, fetch_from: job_opening.designation, read_only: true, in_filter: true}
    - {name: status, type: select, options: [Open, Replied, Rejected, Hold, Accepted], default: Open, required: true, in_list: true, in_filter: true}
    - {name: source, type: select, options: [Campaign, Employee Referral, Walk In, Website Listing, Job Portal, Agency, Other], in_filter: true}
    - {name: source_name, type: data, description: "Referrer, campaign or agency"}
    - {name: resume_attachment, type: attach}
    - {name: resume_link, type: url}
    - {name: cover_letter, type: text}
    - {name: notes, type: text}
    - {name: stage, type: link, to: JobStage, in_list: true, in_filter: true, description: "Where the applicant is: the job's first stage when they apply"}
    - {name: rejection_reason, type: data, visible_if: "doc.status == 'Rejected'"}
    - {name: stage_history, type: table, of: ApplicantStageMove, read_only: true}
  rules:
    - {name: stage_of_the_job, check: "isEmpty(doc.stage) || isEmpty(links.stage.job_opening) || links.stage.job_opening == doc.job_opening", field: stage, message: "is a stage of another job"}
    - {name: rejection_needs_reason, check: "isEmpty(doc.stage) || links.stage.category != 'Rejected' || !isEmpty(doc.rejection_reason)", field: rejection_reason, message: "say why the applicant is rejected"}
  unique: [[email_id, job_opening]]
  list: {columns: [number, applicant_name, job_opening, status], sort: created_at desc}

- name: InterviewDetail
  label: Interviewer
  kind: child
  fields:
    - {name: interviewer, type: email, required: true, in_list: true}

- name: InterviewFeedback
  label: Interview Feedback
  kind: child
  fields:
    - {name: interviewer, type: email, required: true, in_list: true}
    - {name: rating, type: int, required: true, min: 1, max: 5, in_list: true, description: 1 (poor) to 5 (excellent)}
    - {name: result, type: select, options: [Cleared, Rejected], required: true, in_list: true}
    - {name: feedback, type: text}

- name: InterviewScore
  label: Score
  kind: child
  fields:
    - {name: interviewer, type: email, required: true, in_list: true}
    - {name: criterion, type: data, required: true, in_list: true}
    - {name: rating, type: int, required: true, min: 1, max: 5, in_list: true}
    - {name: note, type: text}

- name: Interview
  label: Interview
  kind: master
  module: recruitment
  title_field: applicant_name
  numbering: {template: "HR-INT-{YYYY}-{seq:5}", date_field: scheduled_on}
  fields:
    - {name: job_applicant, type: link, to: JobApplicant, required: true, in_filter: true}
    - {name: applicant_name, type: data, fetch_from: job_applicant.applicant_name, read_only: true, in_list: true}
    - {name: job_opening, type: link, to: JobOpening, fetch_from: job_applicant.job_opening, read_only: true, in_filter: true}
    - {name: interview_round, type: data, required: true, in_list: true}
    - {name: scheduled_on, type: datetime, required: true, in_list: true}
    - {name: status, type: select, options: [Pending, Under Review, Cleared, Rejected], default: Pending, required: true, in_list: true, in_filter: true}
    - {name: interviewers, type: table, of: InterviewDetail, required: true}
    - {name: feedback, type: table, of: InterviewFeedback}
    - {name: average_rating, type: decimal, read_only: true, in_list: true}
    - {name: scores, type: table, of: InterviewScore, label: Scorecard, description: "Each interviewer's rating of each of the job's criteria"}
    - {name: weighted_score, type: decimal, read_only: true, in_list: true, description: "The scorecard's ratings weighted by the job's criteria"}
    - {name: notes, type: text}
  list: {columns: [number, applicant_name, interview_round, scheduled_on, status, average_rating], sort: scheduled_on desc}

- name: JobOffer
  label: Job Offer
  kind: document
  internal: true
  reference: restricted
  module: recruitment
  submittable: true
  company_scoped: true
  title_field: applicant_name
  numbering: {template: "HR-OFF-{YYYY}-{seq:5}", date_field: offer_date}
  fields:
    - {name: job_applicant, type: link, to: JobApplicant, required: true, in_filter: true}
    - {name: applicant_name, type: data, fetch_from: job_applicant.applicant_name, read_only: true, in_list: true}
    - {name: applicant_email, type: email, fetch_from: job_applicant.email_id, read_only: true}
    - {name: job_opening, type: link, to: JobOpening, fetch_from: job_applicant.job_opening, read_only: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: designation, type: link, to: Designation, required: true, in_list: true}
    - {name: department, type: link, to: Department}
    - {name: offer_date, type: date, required: true, default_expr: today, in_list: true}
    - {name: expected_joining_date, type: date}
    - {name: ctc, type: currency, min: "0", label: CTC (annual), perm_group: pay}
    - {name: terms, type: markdown, label: Terms and Conditions}
    - {name: status, type: select, options: [Awaiting Response, Accepted, Rejected], default: Awaiting Response, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: employee, type: link, to: Employee, read_only: true, no_copy: true}
  actions:
    - {name: accept, label: Mark Accepted, docstatus: [1], permission: submit, condition: "doc.status == 'Awaiting Response'"}
    - {name: reject, label: Mark Rejected, docstatus: [1], permission: submit, condition: "doc.status == 'Awaiting Response'"}
    - name: make_employee
      label: Create Employee
      docstatus: [1]
      permission: read
      condition: "doc.status == 'Accepted'"
      params:
        - {name: date_of_joining, type: date, label: Date of Joining, description: "The offer's expected joining date when empty"}
        - {name: user, type: data, label: Sign-in Email, description: "The member who signs in as this employee (their own pages and approvals); none when empty"}
    - name: issue_offer_letter
      label: Issue Offer Letter
      permission: read
      docstatus: [1]
      roles: [HR Manager, HR User]
      group: Letters
      params:
        - {name: send_mail, type: select, options: ["Yes", "No"], label: Send It to the Person, description: "Yes mails the letter with its file attached, through the message template hr.letter_issued"}
      effects:
        - {type: find, entity: EmployeeDocumentType, by: {letter_code: "'offer'"}, create: {type_name: "'Offer letter'", letter_prefix: "'OFR'", category: "'General'", visible_to: "'HR only'"}}
        - {type: create_document, entity: EmployeeLetter, values: {document_type: "results[0].id", company: "doc.company", recipient_name: "doc.applicant_name", recipient_email: "doc.applicant_email", issued_by: "user.email", source_number: "doc.number", employee: "doc.employee"}}
        - {type: generate, template: hr.offer_letter, name: "'Offer letter ' + doc.applicant_name", values: {serial: "results[1].number"}}
        - {type: find, entity: EmployeeLetter, by: {id: "results[1].id"}, update: {sent_to: "has(params.send_mail) && params.send_mail == 'Yes' ? doc.applicant_email : ''"}}
        - {type: message, when: "has(params.send_mail) && params.send_mail == 'Yes'", template: hr.letter_issued, to: "field:applicant_email", channels: [email], values: {serial: "results[1].number"}, attachments: ["results[2]"]}
  list: {columns: [number, applicant_name, designation, offer_date, status], sort: offer_date desc}

- name: AppraisalCycle
  label: Appraisal Cycle
  kind: master
  module: performance
  title_field: cycle_name
  company_scoped: true
  fields:
    - {name: cycle_name, type: data, required: true, unique: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: start_date, type: date, required: true, in_list: true}
    - {name: end_date, type: date, required: true, in_list: true}
    - {name: status, type: select, options: [Not Started, In Progress, Completed], default: Not Started, required: true, in_list: true, in_filter: true}
    - {name: description, type: text}
  rules:
    - {name: ordered_dates, check: "doc.start_date == null || doc.end_date == null || doc.end_date >= doc.start_date", message: "End date must not be before start date"}
  list: {sort: start_date desc}

- name: AppraisalTemplateGoal
  label: Template Goal
  kind: child
  fields:
    - {name: kra, type: data, required: true, label: KRA / Goal, in_list: true}
    - {name: per_weightage, type: percent, required: true, min: "0", max: "100", label: Weightage (%), in_list: true}
    - {name: description, type: text}

- name: AppraisalTemplate
  label: Appraisal Template
  kind: master
  module: performance
  title_field: template_title
  fields:
    - {name: template_title, type: data, required: true, unique: true, in_list: true}
    - {name: goals, type: table, of: AppraisalTemplateGoal, required: true, label: KRAs / Goals}
    - {name: description, type: text}
  list: {sort: template_title asc}

- name: AppraisalGoal
  label: Appraisal Goal
  kind: child
  fields:
    - {name: kra, type: data, required: true, label: KRA / Goal, in_list: true}
    - {name: per_weightage, type: percent, required: true, min: "0", max: "100", label: Weightage (%), in_list: true}
    - {name: self_score, type: decimal, min: "0", max: "5", in_list: true, description: 0 to 5}
    - {name: self_comments, type: text}
    - {name: manager_score, type: decimal, min: "0", max: "5", in_list: true, perm_group: review, description: 0 to 5}
    - {name: manager_comments, type: text, perm_group: review}
    - {name: score_earned, type: decimal, read_only: true, in_list: true, description: Manager score × weightage}

- name: Appraisal
  label: Appraisal
  kind: document
  internal: true
  reference: restricted
  module: performance
  submittable: true
  company_scoped: true
  title_field: employee_name
  owner_fields: [employee_user]
  numbering: {template: "HR-APR-{YYYY}-{seq:5}"}
  description: The employee scores their goals; HR or the manager scores them too and submits. Weightages must total 100.
  fields:
    - {name: employee, type: link, to: Employee, required: true, in_filter: true}
    - {name: employee_name, type: data, fetch_from: employee.employee_name, read_only: true, in_list: true}
    - {name: employee_user, type: email, fetch_from: employee.user, read_only: true, hidden: true, label: Employee's User}
    - {name: company, type: link, to: Company, required: true, read_only: true, in_filter: true}
    - {name: appraisal_cycle, type: link, to: AppraisalCycle, required: true, in_list: true, in_filter: true}
    - {name: appraisal_template, type: link, to: AppraisalTemplate, description: Goals are copied from it when none are entered}
    - {name: goals, type: table, of: AppraisalGoal}
    - {name: self_score, type: decimal, read_only: true, label: Weighted Self Score}
    - {name: final_score, type: decimal, read_only: true, in_list: true, label: Final Score (0-5)}
    - {name: remarks, type: text, perm_group: review}
  list: {columns: [number, employee_name, appraisal_cycle, final_score], sort: created_at desc}

- name: TrainingProgram
  label: Training Program
  kind: master
  module: performance
  title_field: program_name
  company_scoped: true
  fields:
    - {name: program_name, type: data, label: Name, required: true, unique: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: valid_for_months, type: int, min: 1, in_list: true, description: "How long completing it counts; empty: for good"}
    - {name: mandatory, type: check, in_list: true, in_filter: true}
    - {name: description, type: text}
  list: {columns: [program_name, valid_for_months, mandatory], sort: program_name asc}

- name: TrainingAttendee
  label: Training Attendee
  kind: child
  fields:
    - {name: employee, type: link, to: Employee, required: true, in_list: true}
    - {name: result, type: select, options: [Pending, Passed, Failed, Absent], required: true, default: Pending, in_list: true}

- name: TrainingEvent
  label: Training Session
  kind: document
  submittable: true
  module: performance
  title_field: title
  company_scoped: true
  numbering: {template: "HR-TRN-{YYYY}-{seq:5}", on: submit}
  description: "A session of a program. Submitting it records who passed: mark everyone first."
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: program, type: link, to: TrainingProgram, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: held_on, type: date, required: true, in_list: true}
    - {name: trainer, type: data, in_list: true}
    - {name: attendees, type: table, of: TrainingAttendee, required: true}
  list: {columns: [number, title, program, held_on, trainer], sort: held_on desc}

- name: TrainingRecord
  label: Training Record
  kind: master
  module: performance
  title_field: program_name
  company_scoped: true
  owner_fields: [employee_user]
  description: "What someone has completed, and until when it counts. Sessions make these."
  fields:
    - {name: employee, type: link, to: Employee, required: true, read_only: true, in_list: true, in_filter: true, index: true}
    - {name: employee_user, type: email, fetch_from: employee.user, read_only: true, hidden: true, label: Employee's User}
    - {name: program, type: link, to: TrainingProgram, required: true, read_only: true, in_filter: true}
    - {name: program_name, type: data, read_only: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, read_only: true, in_filter: true}
    - {name: session, type: link, to: TrainingEvent, read_only: true}
    - {name: completed_on, type: date, read_only: true, in_list: true}
    - {name: valid_until, type: date, read_only: true, in_list: true, in_filter: true}
  list: {columns: [employee, program_name, completed_on, valid_until], sort: completed_on desc}
