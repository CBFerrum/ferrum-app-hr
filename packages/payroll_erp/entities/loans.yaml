- name: LoanEvent
  label: Loan Event
  kind: child
  fields:
    - {name: event_date, type: date, read_only: true, in_list: true}
    - {name: event_type, type: select, options: [Deferral, Repayment, Write-off, Settled by Statement], read_only: true, in_list: true}
    - {name: amount, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: period_start, type: date, read_only: true, in_list: true, label: Period Deferred}
    - {name: account, type: link, to: Account, read_only: true}
    - {name: reference, type: data, read_only: true, hidden: true, label: Reference Id}
    - {name: reason, type: data, max_length: 500, read_only: true, in_list: true}

- name: LoanRepaymentRow
  label: Loan Instalment
  kind: child
  fields:
    - {name: period_start, type: date, read_only: true, in_list: true, label: Period}
    - {name: principal, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: interest, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: total, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: balance_after, type: currency, currency: parent.currency, read_only: true, in_list: true, label: Balance After}
    - {name: status, type: select, options: [Deducted, Deferred, Due], read_only: true, in_list: true}
    - {name: salary_slip, type: link, to: SalarySlip, read_only: true, on_delete: set_null}
    - {name: note, type: data, max_length: 500, read_only: true}

- name: SalaryLoanRepayment
  label: Loan Repayment
  kind: child
  fields:
    - {name: loan, type: link, to: EmployeeLoan, read_only: true, in_list: true}
    - {name: principal, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: interest, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: total, type: currency, currency: parent.currency, read_only: true, in_list: true}
    - {name: due, type: currency, currency: parent.currency, read_only: true, label: Due This Period}
    - {name: note, type: data, max_length: 500, read_only: true}

- name: EmployeeLoan
  label: Employee Loan
  kind: document
  module: payroll
  submittable: true
  company_scoped: true
  title_field: employee_name
  owner_fields: [employee_user]
  numbering: {template: "HR-LOAN-{YYYY}-{seq:5}", date_field: posting_date}
  description: "Money lent to an employee, paid from the bank on its day (the loan an asset on the employee) and repaid from each monthly salary slip: an amount a month or over a number of months, from the first month, with interest on the reducing balance when a yearly rate is set. A slip never deducts more than the pay allows; what it cannot take is due with the next instalment."
  fields:
    - {name: employee, type: link, to: Employee, required: true, in_filter: true}
    - {name: employee_name, type: data, fetch_from: employee.employee_name, read_only: true, in_list: true}
    - {name: employee_user, type: email, fetch_from: employee.user, read_only: true, hidden: true, label: Employee's User}
    - {name: company, type: link, to: Company, required: true, read_only: true, in_filter: true}
    - {name: currency, type: link, to: Currency, read_only: true}
    - {name: purpose, type: text}
    - {name: loan_amount, type: currency, currency: currency, required: true, in_list: true}
    - {name: posting_date, type: date, required: true, default_expr: today, label: Paid On, in_list: true}
    - {name: payment_account, type: link, to: Account, link_filters: {is_group: false}, label: Paid From, description: "The company's default bank account when empty"}
    - {name: loan_account, type: link, to: Account, link_filters: {is_group: false}, description: "The company's employee loan account when empty"}
    - {name: interest_rate, type: percent, min: "0", max: "100", label: Yearly Interest Rate, description: "On the balance left each month; none when empty"}
    - {name: interest_income_account, type: link, to: Account, link_filters: {is_group: false}, visible_if: "doc.interest_rate > 0.0", description: "The company's loan interest account when empty"}
    - {name: repayment_method, type: select, options: [Number of Periods, Amount per Period], default: Number of Periods, required: true}
    - {name: repayment_periods, type: int, min: "1", visible_if: "doc.repayment_method == 'Number of Periods'", label: Months}
    - {name: repayment_amount, type: currency, currency: currency, visible_if: "doc.repayment_method == 'Amount per Period'", label: Amount a Month}
    - {name: repayment_start_date, type: date, required: true, label: First Repayment, description: "A day in the first month whose salary slip repays it"}
    - {name: schedule, type: table, of: LoanRepaymentRow, read_only: true, description: "Instalments deducted, deferred and still due"}
    - {name: events, type: table, of: LoanEvent, read_only: true, label: Deferrals and Repayments, description: "Months deferred, repaid outside salary, written off or settled by a full and final statement"}
    - {name: repaid_amount, type: currency, currency: currency, read_only: true, no_copy: true, label: Principal Repaid}
    - {name: interest_paid, type: currency, currency: currency, read_only: true, no_copy: true}
    - {name: balance, type: currency, currency: currency, read_only: true, no_copy: true, in_list: true, description: "What is still owed of the principal; the loan account holds it"}
    - {name: status, type: select, options: [Draft, Repaying, Repaid, Written Off, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
  rules:
    - {name: positive, check: "doc.loan_amount > 0.0", message: "The loan amount must be greater than zero"}
    - {name: periods_given, check: "doc.repayment_method != 'Number of Periods' || doc.repayment_periods > 0", message: "Give the number of months it is repaid over"}
    - {name: amount_given, check: "doc.repayment_method != 'Amount per Period' || doc.repayment_amount > 0.0", message: "Give the amount repaid each month"}
    - {name: repaid_after_paid, check: "doc.repayment_start_date == null || doc.posting_date == null || doc.repayment_start_date >= doc.posting_date", message: "Repayment cannot start before the loan is paid"}
  actions:
    - name: defer_instalment
      label: Defer an Instalment
      docstatus: [1]
      permission: submit
      condition: "doc.status == 'Repaying'"
      params:
        - {name: period, type: date, label: Month, required: true, description: "A day in the month whose instalment is skipped; the repayment ends a month later"}
        - {name: reason, type: data, label: Reason, required: true}
    - name: repay
      label: Repay Outside Salary
      docstatus: [1]
      permission: submit
      condition: "doc.status == 'Repaying'"
      params:
        - {name: amount, type: data, label: Amount, description: "The whole balance when empty: the loan paid off"}
        - {name: posting_date, type: date, label: Received On, description: Today when empty}
        - {name: bank_account, type: link, to: Account, label: Paid Into, description: "The company's default bank account when empty"}
        - {name: reason, type: data, label: Note}
    - name: write_off
      label: Write Off
      docstatus: [1]
      permission: submit
      condition: "doc.status == 'Repaying'"
      params:
        - {name: account, type: link, to: Account, label: Written Off To, required: true, description: "The expense account that bears it"}
        - {name: reason, type: data, label: Reason, required: true}
        - {name: posting_date, type: date, label: Posting Date, description: Today when empty}
  list: {columns: [number, employee_name, loan_amount, balance, status], sort: posting_date desc}
