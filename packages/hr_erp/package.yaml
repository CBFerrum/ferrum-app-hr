package: hr_erp
version: 0.4.0
label: HR and ERP
description: Expense claims and employee advances, posted to the ledger and paid through it; the full and final statement of an employee who leaves (last pay, leave encashment, notice, gratuity by the company's rule, claims and advances), settled by one journal entry; the company's employee payable and advance accounts.
depends: [hr, accounting]
field_prefix: hr_

overlays:
  - entity: Company
    ops:
      - {op: add_field, field: {name: hr_employee_payable_account, type: link, to: Account, label: Employee Payable Account, link_filters: {is_group: false}, description: Credited when expense claims are approved}}
      - {op: add_field, field: {name: hr_employee_advance_account, type: link, to: Account, label: Employee Advance Account, link_filters: {is_group: false}}}
      - {op: add_action, action: {name: setup_hr_accounts, label: Create HR and Payroll Accounts, permission: write}}
      # Gratuity on the full and final statement: no country's rule is built in. India's (15 days'
      # pay per year of service on a 26-day month, after 5 years, more than six months counting as a
      # year) is 5, 15, 26, BS (with DA where paid) and the first rounding.
      - {op: add_field, field: {name: hr_gratuity_min_years, type: int, min: "0", label: Gratuity After (Years), description: "Service needed before gratuity is due; not on a death"}}
      - {op: add_field, field: {name: hr_gratuity_days_per_year, type: decimal, min: "0", label: Gratuity Days per Year, description: "Days' pay for each year of service (0 = no gratuity)"}}
      - {op: add_field, field: {name: hr_gratuity_days_in_month, type: decimal, min: "0", label: Gratuity Days in a Month, description: "A month's pay over this is a day's pay (30 when empty)"}}
      - {op: add_field, field: {name: hr_gratuity_pay_formula, type: code, label: Gratuity Pay, description: "The monthly pay it is based on: a formula over the last salary slip's components, e.g. BS or BS + DA (gross when empty)"}}
      - {op: add_field, field: {name: hr_gratuity_part_year, type: select, options: [More than six months counts as a year, Completed years only, Pro rata], label: Gratuity Part Years, description: "How a part year of service counts (more than six months counts as a year when empty)"}}
  - entity: JournalEntry
    ops:
      - {op: add_field, field: {name: hr_reference_type, type: select, label: HR Reference Type, options: [Expense Claim, Employee Advance, Employee Advance Return, Payroll Entry, Full and Final Statement], read_only: true, in_filter: true}}
      - {op: add_field, field: {name: hr_reference, type: data, label: HR Reference, read_only: true, description: "Id of the expense claim, employee advance, payroll entry or full and final statement this entry settles"}}
      - {op: add_field, field: {name: hr_reference_number, type: data, label: HR Reference No, read_only: true}}
  - entity: EmployeeSeparation
    ops:
      - {op: add_action, action: {name: make_full_and_final, label: Create Full and Final Statement, docstatus: [1], permission: read}}

modules:
  - name: expenses
    label: Expense Claims
    icon: receipt
    order: 72
    items: [ExpenseClaim, EmployeeAdvance, ExpenseClaimType, report:expense_claim_summary]

workflows:
  - name: Expense Approval
    entity: ExpenseClaim
    initial_state: Draft
    states:
      - {name: Draft, docstatus: 0}
      - {name: Approved, docstatus: 1}
      - {name: Rejected, docstatus: 1}
      - {name: Cancelled, docstatus: 2}
    transitions:
      - {action: Approve, from: Draft, to: Approved, roles: [Expense Approver, HR Manager]}
      - {action: Reject, from: Draft, to: Rejected, roles: [Expense Approver, HR Manager]}
      - {action: Cancel, from: Approved, to: Cancelled, roles: [Expense Approver, HR Manager]}
      - {action: Cancel, from: Rejected, to: Cancelled, roles: [Expense Approver, HR Manager]}

roles:
  - name: HR Manager
    permissions:
      - {entity: ExpenseClaimType, read: true, write: true, create: true, delete: true, export: true}
      - {entity: ExpenseClaim, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: EmployeeAdvance, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: FullAndFinalStatement, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: JournalEntry, read: true, create: true}
      - {entity: Account, read: true}
      - {entity: CostCenter, read: true}
      - {entity: Project, read: true}
  - name: HR User
    permissions:
      - {entity: ExpenseClaimType, read: true}
      - {entity: ExpenseClaim, read: true, write: true, create: true, delete: true}
      - {entity: EmployeeAdvance, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: FullAndFinalStatement, read: true, write: true, create: true, delete: true}
      - {entity: CostCenter, read: true}
      - {entity: Project, read: true}
  - name: Employee
    permissions:
      - {entity: ExpenseClaim, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: EmployeeAdvance, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: FullAndFinalStatement, read: true, if_owner: true}
      - {entity: ExpenseClaimType, read: true}
  - name: Expense Approver
    description: Sanctions, approves or rejects the expense claims routed to them.
    permissions:
      - {entity: ExpenseClaim, read: true, write: true, submit: true, cancel: true}
      - {entity: ExpenseClaimType, read: true}
      - {entity: EmployeeAdvance, read: true}

# Kept when a person asks for their data to be erased: what was paid to and recovered from them.
personal_data:
  - {entity: ExpenseClaim, match: employee_user, retain: "Accounting records"}
  - {entity: EmployeeAdvance, match: employee_user, retain: "Accounting records"}
  - {entity: FullAndFinalStatement, match: employee_user, retain: "Accounting records"}

seed:
  - entity: ExpenseClaimType
    key: [expense_type]
    records:
      - {expense_type: Travel}
      - {expense_type: Food}
      - {expense_type: Accommodation}
      - {expense_type: Medical}
      - {expense_type: Others}
