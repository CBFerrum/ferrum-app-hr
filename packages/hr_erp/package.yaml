package: hr_erp
version: 0.1.0
label: HR and ERP
description: Expense claims and employee advances, posted to the ledger and paid through it; the company's employee payable and advance accounts.
depends: [hr, accounting]
field_prefix: hr_

overlays:
  - entity: Company
    ops:
      - {op: add_field, field: {name: hr_employee_payable_account, type: link, to: Account, label: Employee Payable Account, link_filters: {is_group: false}, description: Credited when expense claims are approved}}
      - {op: add_field, field: {name: hr_employee_advance_account, type: link, to: Account, label: Employee Advance Account, link_filters: {is_group: false}}}
      - {op: add_action, action: {name: setup_hr_accounts, label: Create HR and Payroll Accounts, permission: write}}
  - entity: JournalEntry
    ops:
      - {op: add_field, field: {name: hr_reference_type, type: select, label: HR Reference Type, options: [Expense Claim, Employee Advance, Employee Advance Return, Payroll Entry], read_only: true, in_filter: true}}
      - {op: add_field, field: {name: hr_reference, type: data, label: HR Reference, read_only: true, description: "Id of the expense claim, employee advance or payroll entry this entry settles"}}
      - {op: add_field, field: {name: hr_reference_number, type: data, label: HR Reference No, read_only: true}}

modules:
  - name: expenses
    label: Expense Claims
    icon: receipt
    order: 72
    items: [ExpenseClaim, EmployeeAdvance, ExpenseClaimType, report:expense_claim_summary]

workflows:
  - name: Expense Approval
    entity: ExpenseClaim
    initial_state: Draft
    states:
      - {name: Draft, docstatus: 0}
      - {name: Approved, docstatus: 1}
      - {name: Rejected, docstatus: 1}
      - {name: Cancelled, docstatus: 2}
    transitions:
      - {action: Approve, from: Draft, to: Approved, roles: [Expense Approver, HR Manager]}
      - {action: Reject, from: Draft, to: Rejected, roles: [Expense Approver, HR Manager]}
      - {action: Cancel, from: Approved, to: Cancelled, roles: [Expense Approver, HR Manager]}
      - {action: Cancel, from: Rejected, to: Cancelled, roles: [Expense Approver, HR Manager]}

roles:
  - name: HR Manager
    permissions:
      - {entity: ExpenseClaimType, read: true, write: true, create: true, delete: true, export: true}
      - {entity: ExpenseClaim, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: EmployeeAdvance, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: JournalEntry, read: true, create: true}
      - {entity: Account, read: true}
      - {entity: CostCenter, read: true}
      - {entity: Project, read: true}
  - name: HR User
    permissions:
      - {entity: ExpenseClaimType, read: true}
      - {entity: ExpenseClaim, read: true, write: true, create: true, delete: true}
      - {entity: EmployeeAdvance, read: true, write: true, create: true, delete: true, submit: true}
      - {entity: CostCenter, read: true}
      - {entity: Project, read: true}
  - name: Employee
    permissions:
      - {entity: ExpenseClaim, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: EmployeeAdvance, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: ExpenseClaimType, read: true}
  - name: Expense Approver
    description: Sanctions, approves or rejects the expense claims routed to them.
    permissions:
      - {entity: ExpenseClaim, read: true, write: true, submit: true, cancel: true}
      - {entity: ExpenseClaimType, read: true}
      - {entity: EmployeeAdvance, read: true}

seed:
  - entity: ExpenseClaimType
    key: [expense_type]
    records:
      - {expense_type: Travel}
      - {expense_type: Food}
      - {expense_type: Accommodation}
      - {expense_type: Medical}
      - {expense_type: Others}
