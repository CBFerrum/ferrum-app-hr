id: hr
name: HR and Payroll
version: 0.5.0
publisher: cbferrum
summary: Employees, attendance, shifts, leave, recruitment, appraisals, salary structures and payroll
description: README.md
categories: [hr, finance]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-hr
support: https://github.com/CBFerrum/ferrum-app-hr/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [hr, payroll]
uninstall: ask
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: people
      route: people
      title: People
      description: Your leave and check-ins, approvals, the team calendar and the people directory; employees, attendance, recruitment and payroll
      icon: users
      color: "#0e7490"
      roles: [HR Manager, HR User, Employee, Leave Approver, Payroll Manager]
  shell.open:
    # HR's and payroll's records, and those the hr-erp connector adds (expense claims, payroll's
    # accounts), in People's forms and lists.
    - {id: hr, package: hr, path: "people/e/{entity}/{id}", list: "people/e/{entity}"}
    - {id: payroll, package: payroll, path: "people/e/{entity}/{id}", list: "people/e/{entity}"}
    - {id: hr_erp, package: hr_erp, path: "people/e/{entity}/{id}", list: "people/e/{entity}"}
    - {id: payroll_erp, package: payroll_erp, path: "people/e/{entity}/{id}", list: "people/e/{entity}"}
  shell.create:
    - {id: leave, label: Leave request, path: people/e/LeaveApplication/new, entity: LeaveApplication}
    - {id: attendance, label: Attendance request, path: people/e/AttendanceRequest/new, entity: AttendanceRequest}
  # Home's My work: the requests routed to you that wait for your decision.
  shell.work:
    - {id: requests, title: Requests waiting for you, endpoint: /api/app/hr/work}
  # The careers page anyone may open, at /people/careers/{workspace}: the published openings and
  # an application form.
  shell.public:
    - {id: careers, path: people/careers, title: Careers}
  shell.notification:
    - {id: leave_request, label: Leave requests waiting for your approval, default: [inapp, email]}
    - {id: leave_decision, label: Decisions on your leave requests, default: [inapp, email]}
    - {id: expense_request, label: Expense claims waiting for your approval, default: [inapp, email]}
    - {id: expense_decision, label: Decisions on your expense claims, default: [inapp, email]}
    - {id: attendance_request, label: Attendance requests waiting for your approval, default: [inapp, email]}
    - {id: attendance_decision, label: Decisions on your attendance requests, default: [inapp, email]}
